<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e9">
  <meta name="description" content="二級建築基準適合判定資格者向け 建築基準法○×学習アプリ">
  <title>二級適判 ○×トレーニング</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell" aria-labelledby="app-title">
    <header class="app-header">
      <div>
        <p class="eyebrow">二級建築基準適合判定資格者</p>
        <h1 id="app-title">二級適判 ○×トレーニング</h1>
      </div>
      <div class="score" aria-live="polite">
        <span>正解</span>
        <strong id="score">0</strong>
      </div>
    </header>

    <section class="progress-area" aria-label="学習の進捗">
      <div class="progress-labels">
        <span id="category">建築基準法</span>
        <strong id="progress-text">1 / 10</strong>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
    </section>

    <section id="quiz-card" class="quiz-card">
      <p class="question-number" id="question-number">QUESTION 01</p>
      <h2 id="question-text" class="question-text"></h2>

      <div id="answer-buttons" class="answer-buttons" aria-label="回答を選択">
        <button class="answer-button answer-true" type="button" data-answer="true" aria-label="正しい、まる">
          <span class="symbol" aria-hidden="true">○</span>
          <span>正しい</span>
        </button>
        <button class="answer-button answer-false" type="button" data-answer="false" aria-label="誤り、ばつ">
          <span class="symbol" aria-hidden="true">×</span>
          <span>誤り</span>
        </button>
      </div>

      <div id="feedback" class="feedback" hidden aria-live="assertive">
        <div class="result-line">
          <span id="result-icon" class="result-icon" aria-hidden="true"></span>
          <div>
            <p id="result-text" class="result-text"></p>
            <p id="correct-answer" class="correct-answer"></p>
          </div>
        </div>
        <div class="explanation">
          <p class="explanation-label">解説</p>
          <p id="explanation-text"></p>
          <p id="reference-text" class="reference"></p>
        </div>
        <button id="next-button" class="next-button" type="button">次の問題 <span aria-hidden="true">→</span></button>
      </div>
    </section>

    <section id="completion" class="completion" hidden aria-live="polite">
      <p class="completion-mark" aria-hidden="true">✓</p>
      <p class="eyebrow">10問終了</p>
      <h2>おつかれさまでした</h2>
      <p class="final-score"><strong id="final-score">0</strong><span> / 10 正解</span></p>
      <p id="final-message" class="final-message"></p>
      <button id="restart-button" class="next-button" type="button">もう一度挑戦</button>
    </section>

    <footer>学習用サンプルです。実務では最新の法令・告示をご確認ください。</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
